name: hr_admin
description: "İnsan Kaynakları Yönetim Sistemi - HR Admin Panel"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core Dependencies
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^14.3.0
  get_it: ^8.0.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  intl: ^0.19.0

  # UI Dependencies
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1

  # Storage
  flutter_secure_storage: ^9.2.2

  # Charts
  syncfusion_flutter_charts: ^27.2.5
  syncfusion_flutter_datagrid: ^27.2.5
  fl_chart: ^0.70.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/logo/
    - assets/animations/
